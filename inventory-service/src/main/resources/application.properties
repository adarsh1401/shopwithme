spring.application.name=inventory-service

spring.datasource.url=jdbc:mysql://mysql:3306/inventory_service?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=roots

spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

server.port=8082

# (Optional) If Flyway is creating issues
spring.flyway.enabled=false
