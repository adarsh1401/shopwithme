<!DOCTYPE html>
<html ng-app="shopWithMeApp">
<head>
    <title>Signup</title>
    <link rel="stylesheet" href="css/style.css">

    <!-- AngularJS CDN -->
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <script src="js/app.js"></script>
</head>

<body ng-controller="AuthController">

<h2>Signup</h2>

<input type="text" placeholder="Username" ng-model="signupData.username">
<input type="password" placeholder="Password" ng-model="signupData.password">

<button ng-click="signup()">Signup</button>

<p>
    Already have an account?
    <a href="login.html">Login</a>
</p>

</body>
</html>
